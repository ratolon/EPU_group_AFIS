[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "epu-group-afis"
version = "0.2.0"
description = "Cluster EPU AFIS beam-shift metadata into RELION optics groups"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE.txt"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy",
    "matplotlib",
    "scikit-learn",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
epu_group_afis = "EPU_Group_AFIS:cli"

[tool.setuptools]
py-modules = ["EPU_Group_AFIS"]
