[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "epu-group-afis"
version = "0.1.0"
description = "Cluster EPU AFIS beam-shift metadata into RELION optics groups"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "matplotlib",
    "scikit-learn",
]

[project.scripts]
epu_group_afis = "EPU_Group_AFIS:cli"

[tool.setuptools]
py-modules = ["EPU_Group_AFIS"]
